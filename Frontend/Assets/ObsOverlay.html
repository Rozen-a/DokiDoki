<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DokiDoki OBS</title>
<style>
html,body{margin:0;background:transparent;overflow:hidden}
body{font:700 238px "Segoe UI",sans-serif;color:#22354f}
#overlay{display:grid;grid-template-rows:416px minmax(0,1fr);width:960px;height:720px;box-sizing:border-box;padding:8px;gap:8px}

#readingSlot{display:grid;place-items:center;min-width:0;min-height:0}
#overlay[hidden],svg[hidden]{display:none}
#reading,#rate{display:flex;align-items:center}
#reading{gap:14px;width:max-content}
#reading.right{flex-direction:row-reverse}
img{width:336px;height:336px;margin:0 -21px;image-rendering:pixelated}
#rate{white-space:nowrap}
#bpm{--outline:6px;width:3ch;text-align:right;font-variant-numeric:tabular-nums}
#unit{--outline:2px}
#bpm,#unit{text-shadow:var(--outline) 0 #fff,calc(-1 * var(--outline)) 0 #fff,0 var(--outline) #fff,0 calc(-1 * var(--outline)) #fff}
#unit{font-size:77px;margin:0 0 42px 21px;align-self:flex-end;color:#394c68}
svg{display:block;justify-self:center;width:100%;max-width:100%;height:100%;min-height:0;border-radius:28px}
svg.shaded{background:rgba(221,238,255,.61)}
</style>
</head>
<body>
<div id="overlay" hidden>
  <div id="readingSlot"><div id="reading"><img src="/heart.png" alt=""><div id="rate"><span id="bpm">—</span><span id="unit">BPM</span></div></div></div>
  <svg id="chart" viewBox="0 0 100 33" preserveAspectRatio="none" aria-label="最近 60 秒心率">
    <polyline id="line" fill="none" stroke="#c4346b" stroke-width="0.65" stroke-linejoin="round"/>
  </svg>
</div>
<script>
const overlay = document.querySelector('#overlay');
const reading = document.querySelector('#reading');
const bpm = document.querySelector('#bpm');
const unit = document.querySelector('#unit');
const chart = document.querySelector('#chart');
const line = document.querySelector('#line');

const heart = reading.querySelector('img');
let targetTempo = 0, currentTempo = 0, phase = 0, lastFrame = 0, frame = 0;

// Ease the animation tempo while preserving phase across incoming samples.
function animate(now) {
  const seconds = Math.max(0, now - lastFrame) / 1000;
  lastFrame = now;
  const difference = currentTempo - targetTempo;
  const blend = 1 - Math.exp(-seconds / 0.75);
  phase = (phase + (targetTempo * seconds + difference * 0.75 * blend) / 60) % 1;
  currentTempo -= difference * blend;
  heart.style.transform = 'scale(' + (1 + 0.09 * (1 - Math.cos(2 * Math.PI * phase))) + ')';
  frame = requestAnimationFrame(animate);
}

// Start once per live session and restore the original size when idle.
function setTempo(tempo) {
  targetTempo = tempo;
  if (tempo > 0 && !frame) {
    currentTempo = tempo;
    lastFrame = performance.now();
    frame = requestAnimationFrame(animate);
  } else if (!tempo && frame) {
    cancelAnimationFrame(frame);
    frame = 0;
    phase = 0;
    heart.style.transform = '';
  }
}

// Poll serially and hide the overlay if DokiDoki stops serving.
async function refresh() {
  try {
    const response = await fetch('/state', {signal: AbortSignal.timeout(2000)});
    if (!response.ok) throw Error(response.status);
    const state = await response.json();
    bpm.textContent = state.bpm ?? '—';
    unit.hidden = state.hideBpm === true;
    reading.classList.toggle('right', state.heartRight);
    chart.toggleAttribute('hidden', !state.showTrend);
    chart.classList.toggle('shaded', state.showBackground);
    const points = state.points ?? [];
    const values = points.map(point => point.bpm);
    const floor = Math.min(...values) - 3, ceiling = Math.max(...values) + 3;
    line.setAttribute('points', points.map(point =>
      [4 + 92 * Math.max(0, Math.min(1, point.position)),
       4 + 25 * (ceiling - point.bpm) / (ceiling - floor)].join(',')
    ).join(' '));
    overlay.hidden = false;
    // Match the reading row after the BPM unit has entered or left the layout.
    chart.style.width = reading.getBoundingClientRect().width + 'px';
    setTempo(state.pulseTempo || 0);
  } catch {
    overlay.hidden = true;
    setTempo(0);
  } finally {
    setTimeout(refresh, 500);
  }
}
refresh();
</script>
</body>
</html>
